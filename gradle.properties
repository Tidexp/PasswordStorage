# Project-wide Gradle settings.
# For more details on how to configure your build environment visit
# https://developer.android.com/studio/build/optimize-your-build

# Specifies the JVM arguments used for the Gradle Daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enables parallel build execution
org.gradle.parallel=true

# Enables build caching
org.gradle.caching=true

# AndroidX package structure
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Enables non-transitive R classes for faster builds
android.nonTransitiveRClass=true
